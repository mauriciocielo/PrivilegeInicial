name: Fila de e-mails

# Aciona o processamento da fila de e-mails a cada 10 minutos. Fica aqui, e não no
# vercel.json, porque o plano Hobby da Vercel recusa o deploy com agendamento mais de
# uma vez por dia. A variável APP_URL é opcional e troca o endereço padrão.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  lote:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Processar próximo lote
        env:
          APP_URL: ${{ vars.APP_URL || 'https://privilege-inicial.vercel.app' }}
        run: |
          status=$(curl -sS -o resposta.json -w '%{http_code}' --max-time 90 \
            "$APP_URL/api/email-servicos/queue/cron")
          cat resposta.json; echo
          if [ "$status" != "200" ]; then
            echo "::error::A fila de e-mails respondeu HTTP $status."
            exit 1
          fi
