name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # URL fake só para o Prisma Client conseguir ser gerado e o build compilar —
    # nenhuma etapa aqui precisa de um banco de dados real.
    env:
      DATABASE_URL: "postgresql://user:password@localhost:5432/ci_placeholder"
      SESSION_SECRET: "ci-only-placeholder-secret-nao-usar-em-producao"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Mesma versão do ambiente de desenvolvimento: o package-lock.json é gerado pelo
      # npm 11 (Node 24), e o npm 10 do Node 20 o recusa no `npm ci`.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      # O next/font baixa as fontes do Google Fonts durante o build, e esse download às
      # vezes falha no runner do GitHub ("module-not-found" em [next]/internal/font/google).
      # Uma falha de rede não deve reprovar o código: tenta de novo antes de desistir.
      - name: Build
        run: |
          for tentativa in 1 2 3; do
            npm run build && exit 0
            echo "::warning::Build falhou na tentativa $tentativa (provável falha ao baixar fontes do Google). Tentando de novo..."
            sleep 20
          done
          exit 1
